<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 210" width="704" height="210" role="img" aria-label="DG-10  Troubleshooting escalation">
<title>DG-10  Troubleshooting escalation</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C636E"/></marker></defs>
<rect width="704" height="210" fill="white"/>
<text x="14" y="22" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#14171C">DG-10  Troubleshooting escalation</text>
<line x1="14" y1="30" x2="690" y2="30" stroke="#C40046" stroke-width="2"/>
<rect x="14" y="55" width="200" height="50" rx="6" fill="#FDE7EE" stroke="#B9BFC7" stroke-width="1"/><text x="114" y="84" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">Symptom observed</text><line x1="214" y1="80" x2="240" y2="80" stroke="#5C636E" stroke-width="1.6" marker-end="url(#a)"/><rect x="240" y="55" width="210" height="50" rx="6" fill="#F4F5F7" stroke="#B9BFC7" stroke-width="1"/><text x="345" y="77" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">Check the decision tree</text><text x="345" y="91" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C636E" text-anchor="middle">A / B / C in the guide</text><line x1="450" y1="80" x2="476" y2="80" stroke="#5C636E" stroke-width="1.6" marker-end="url(#a)"/><rect x="476" y="55" width="212" height="50" rx="6" fill="#F4F5F7" stroke="#B9BFC7" stroke-width="1"/><text x="582" y="84" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">Resolved?</text><line x1="582" y1="105" x2="582" y2="134" stroke="#5C636E" stroke-width="1.6" marker-end="url(#a)"/><text x="582" y="120" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="9" fill="#5C636E" text-anchor="middle">no</text><rect x="400" y="134" width="288" height="60" rx="6" fill="#FDE7EE" stroke="#B9BFC7" stroke-width="1"/><text x="544" y="154" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">ESCALATE with:</text><text x="544" y="168" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C636E" text-anchor="middle">version + commit, mode, discipline,</text><text x="544" y="182" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C636E" text-anchor="middle">what you did / expected / observed</text><rect x="14" y="134" width="366" height="60" rx="6" fill="white" stroke="#C40046" stroke-width="1.5"/><text x="197" y="161" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#14171C" text-anchor="middle">NEVER disable Defender, SmartScreen or the Firewall.</text><text x="197" y="175" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C636E" text-anchor="middle">NEVER delete session data to clear a fault - recovery needs it.</text>
</svg>
