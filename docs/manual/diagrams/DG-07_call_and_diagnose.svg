<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 250" width="704" height="250" role="img" aria-label="DG-07  Call &amp; Diagnose workflow">
<title>DG-07  Call &amp; Diagnose workflow</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C636E"/></marker></defs>
<rect width="704" height="250" fill="white"/>
<text x="14" y="22" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#14171C">DG-07  Call &amp; Diagnose workflow</text>
<line x1="14" y1="30" x2="690" y2="30" stroke="#C40046" stroke-width="2"/>
<rect x="14" y="55" width="124" height="52" rx="6" fill="#F4F5F7" stroke="#B9BFC7" stroke-width="1"/><text x="76" y="85" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">Fire shot</text><rect x="152" y="55" width="124" height="52" rx="6" fill="#FDE7EE" stroke="#B9BFC7" stroke-width="1"/><text x="214" y="78" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">Actual HIDDEN</text><text x="214" y="92" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C636E" text-anchor="middle">not shown</text><line x1="138" y1="81" x2="150" y2="81" stroke="#5C636E" stroke-width="1.6" marker-end="url(#a)"/><rect x="290" y="55" width="124" height="52" rx="6" fill="#F4F5F7" stroke="#B9BFC7" stroke-width="1"/><text x="352" y="78" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">Mark the call</text><text x="352" y="92" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C636E" text-anchor="middle">athlete</text><line x1="276" y1="81" x2="288" y2="81" stroke="#5C636E" stroke-width="1.6" marker-end="url(#a)"/><rect x="428" y="55" width="124" height="52" rx="6" fill="#FDE7EE" stroke="#B9BFC7" stroke-width="1"/><text x="490" y="85" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">CONFIRM CALL</text><line x1="414" y1="81" x2="426" y2="81" stroke="#5C636E" stroke-width="1.6" marker-end="url(#a)"/><rect x="566" y="55" width="124" height="52" rx="6" fill="#F4F5F7" stroke="#B9BFC7" stroke-width="1"/><text x="628" y="78" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">Reveal</text><text x="628" y="92" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C636E" text-anchor="middle">call vs actual</text><line x1="552" y1="81" x2="564" y2="81" stroke="#5C636E" stroke-width="1.6" marker-end="url(#a)"/><line x1="628" y1="107" x2="628" y2="136" stroke="#5C636E" stroke-width="1.6" marker-end="url(#a)"/><rect x="490" y="136" width="200" height="46" rx="6" fill="#FDE7EE" stroke="#B9BFC7" stroke-width="1"/><text x="590" y="163" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">CONTINUE TO NEXT SHOT</text><rect x="14" y="136" width="460" height="46" rx="6" fill="white" stroke="#C40046" stroke-width="1.5"/><text x="244" y="163" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">ONE unresolved shot at a time - the next shot is refused until the call is confirmed</text><rect x="14" y="194" width="676" height="40" rx="6" fill="white" stroke="#E8A13C" stroke-width="1.5"/><text x="352" y="218" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">Call bias is a PERCEPTION observation. It is not a sight-adjustment recommendation.</text>
</svg>
