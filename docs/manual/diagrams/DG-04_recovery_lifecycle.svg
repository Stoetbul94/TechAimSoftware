<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 206" width="704" height="206" role="img" aria-label="DG-04  Recovery lifecycle">
<title>DG-04  Recovery lifecycle</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C636E"/></marker></defs>
<rect width="704" height="206" fill="white"/>
<text x="14" y="22" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#14171C">DG-04  Recovery lifecycle</text>
<line x1="14" y1="30" x2="690" y2="30" stroke="#C40046" stroke-width="2"/>
<rect x="14" y="55" width="180" height="56" rx="6" fill="#FDE7EE" stroke="#B9BFC7" stroke-width="1"/><text x="104" y="80" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">Interruption</text><text x="104" y="94" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C636E" text-anchor="middle">crash / power / kill</text><line x1="194" y1="83" x2="220" y2="83" stroke="#5C636E" stroke-width="1.6" marker-end="url(#a)"/><rect x="220" y="55" width="180" height="56" rx="6" fill="#F4F5F7" stroke="#B9BFC7" stroke-width="1"/><text x="310" y="80" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">Restart</text><text x="310" y="94" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C636E" text-anchor="middle">TechAim.exe</text><line x1="400" y1="83" x2="426" y2="83" stroke="#5C636E" stroke-width="1.6" marker-end="url(#a)"/><rect x="426" y="55" width="262" height="56" rx="6" fill="#F4F5F7" stroke="#B9BFC7" stroke-width="1"/><text x="557" y="80" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">Unfinished session found?</text><text x="557" y="94" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C636E" text-anchor="middle">completed sessions are NEVER offered</text><line x1="490" y1="111" x2="490" y2="140" stroke="#5C636E" stroke-width="1.6" marker-end="url(#a)"/><text x="490" y="126" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="9" fill="#5C636E" text-anchor="middle">yes</text><rect x="370" y="140" width="150" height="50" rx="6" fill="#FDE7EE" stroke="#B9BFC7" stroke-width="1"/><text x="445" y="162" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">Resume</text><text x="445" y="176" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C636E" text-anchor="middle">Match / Training</text><line x1="620" y1="111" x2="620" y2="140" stroke="#5C636E" stroke-width="1.6" marker-end="url(#a)"/><text x="620" y="126" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="9" fill="#5C636E" text-anchor="middle">discard</text><rect x="546" y="140" width="142" height="50" rx="6" fill="#F4F5F7" stroke="#B9BFC7" stroke-width="1"/><text x="617" y="169" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">Discard</text><rect x="14" y="140" width="340" height="50" rx="6" fill="white" stroke="#C40046" stroke-width="1.5"/><text x="184" y="162" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#14171C" text-anchor="middle">If the record cannot be validated it is REPORTED,</text><text x="184" y="176" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C636E" text-anchor="middle">never silently loaded. Preserve it and escalate.</text>
</svg>
