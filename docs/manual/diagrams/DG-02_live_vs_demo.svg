<rect width="704" height="292" fill="white"/>
<text x="14" y="22" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#14171C">DG-02  Live versus Demo</text>
<line x1="14" y1="30" x2="690" y2="30" stroke="#C40046" stroke-width="2"/>
<rect x="240" y="50" width="220" height="44" rx="6" fill="#FDE7EE" stroke="#B9BFC7" stroke-width="1"/><text x="350" y="76" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">Shot arrives</text><rect x="40" y="130" width="250" height="76" rx="6" fill="#F4F5F7" stroke="#B9BFC7" stroke-width="1"/><text x="165" y="158" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">LIVE TARGET</text><text x="165" y="172" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C636E" text-anchor="middle">physical target input accepted</text><text x="165" y="186" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C636E" text-anchor="middle">simulated input REJECTED</text><rect x="414" y="130" width="250" height="76" rx="6" fill="#F4F5F7" stroke="#B9BFC7" stroke-width="1"/><text x="539" y="158" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">DEMO / SIMULATION</text><text x="539" y="172" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C636E" text-anchor="middle">generated input accepted</text><text x="539" y="186" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C636E" text-anchor="middle">physical input REJECTED</text><line x1="300" y1="94" x2="165" y2="130" stroke="#5C636E" stroke-width="1.6" marker-end="url(#a)"/><text x="232" y="112" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="9" fill="#5C636E" text-anchor="middle">operating mode = Live</text><line x1="400" y1="94" x2="539" y2="130" stroke="#5C636E" stroke-width="1.6" marker-end="url(#a)"/><text x="470" y="112" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="9" fill="#5C636E" text-anchor="middle">operating mode = Demo</text><rect x="40" y="232" width="624" height="44" rx="6" fill="white" stroke="#C40046" stroke-width="1.5"/><text x="352" y="258" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">The mode gate exists so a demonstration can never be presented as a real result</text>
