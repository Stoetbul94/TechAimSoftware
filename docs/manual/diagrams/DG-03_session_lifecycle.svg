<rect x="14" y="55" width="158" height="56" rx="6" fill="#F4F5F7" stroke="#B9BFC7" stroke-width="1"/><text x="93" y="80" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">NEW</text><text x="93" y="94" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C636E" text-anchor="middle">session identity created</text><rect x="186" y="55" width="158" height="56" rx="6" fill="#F4F5F7" stroke="#B9BFC7" stroke-width="1"/><text x="265" y="80" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">ACTIVE</text><text x="265" y="94" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C636E" text-anchor="middle">shots recorded</text><line x1="172" y1="83" x2="184" y2="83" stroke="#5C636E" stroke-width="1.6" marker-end="url(#a)"/><rect x="358" y="55" width="158" height="56" rx="6" fill="#F4F5F7" stroke="#B9BFC7" stroke-width="1"/><text x="437" y="80" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">COMPLETED</text><text x="437" y="94" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C636E" text-anchor="middle">course finished</text><line x1="344" y1="83" x2="356" y2="83" stroke="#5C636E" stroke-width="1.6" marker-end="url(#a)"/><rect x="530" y="55" width="158" height="56" rx="6" fill="#FDE7EE" stroke="#B9BFC7" stroke-width="1"/><text x="609" y="80" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">CLOSED</text><text x="609" y="94" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C636E" text-anchor="middle">durably closed, UI reset</text><line x1="516" y1="83" x2="528" y2="83" stroke="#5C636E" stroke-width="1.6" marker-end="url(#a)"/><line x1="609" y1="111" x2="609" y2="140" stroke="#5C636E" stroke-width="1.6" marker-end="url(#a)"/><rect x="530" y="140" width="158" height="44" rx="6" fill="#FDE7EE" stroke="#B9BFC7" stroke-width="1"/><text x="609" y="159" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">Home</text><text x="609" y="173" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5C636E" text-anchor="middle">or NEW SESSION</text><rect x="14" y="140" width="490" height="44" rx="6" fill="white" stroke="#E8A13C" stroke-width="1.5"/><text x="259" y="166" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#14171C" text-anchor="middle">Force-closing instead leaves the session UNFINISHED -&gt; offered for recovery</text>
